Help:
  Prefix: '&e&m-----&6&l BetterRTP &8| Ajutor &e&m-----'
  Main: ' &7- &e/%command% &7- Te teleporteaza random!'
  Biome: ' &7- &e/%command% biome <biome1, biome2...> &7- Te teleporteaza random intre aceste biome-uri'
  Edit: ' &7- &e/%command% edit <default/world> [args...] &7- Editeaza niste setari ale plugin-ului'
  Help: ' &7- &e/%command% help &7- Arata pagina de ajutor al acestui plugin'
  Info: ' &7- &e/%command% info [world/particles/shapes/potion_effects] &7- Vezi informatii specifice despre niste parametrii ai acestui plugin'
  Player: ' &7- &e/%command% player <player> [world] [biome1, biome2...] &7- Teleporteaza random alt jucator'
  Reload: ' &7- &e/%command% reload &7- Reincarca plugin-ul'
  Settings: ' &7- &e/%command% settings &7- Apare un GUI si poti edita niste setari'
  Test: ' &7- &e/%command% test &7- Testezi efectele teleportarii fara a te misca'
  Version: ' &7- &e/%command% version &7- Vezi versiunea curenta'
  World: ' &7- &e/%command% world <world> [biome1, biome2...] &7- Te teleporteaza random in alta lume'
#  Location: ' &7- &e/%command% location <location_name> &7- Rtp using a specific location'

Usage:
  Player: '&cFolosire&7: /%command% player <nume> [world] [biome1, biome2]'
  World: '&cFolosire&7: /%command% world <lume> [biome1, biome2...]'
  Biome: '&cFolosire&7: /%command% biome <biome1, biome2...>'
#  Location: '&cUsage&7: /%command% location <location_name>'
  Edit:
    Base: '&cFolosire&7: /%command% edit <default/world> [args...]'
    Default: '&cFolosire&7: /%command% edit default <max/min/useworldborder/center> <value>'
    World: '&cFolosire&7: /%command% edit world <world> <max/min/useworldborder/center> <value>'
#    PermissionGroup: '&cUsage&7: /%command% edit permission_group <group> <world> <max/min/useworldborder/center> <value>'
#    Worldtype: '&cUsage&7: /%command% edit world_type <world> <NETHER/NORMAL>'
#    Override: '&cUsage&7: /%command% edit override <world> <world_to>'
#    BlacklistedBlocks: '&cUsage&7: /%command% edit blacklistedblocks <add/remove> <block_id>'
