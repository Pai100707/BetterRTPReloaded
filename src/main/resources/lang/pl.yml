Help:
  Prefix: '&e&m-----&6&l BetterRTP &8| Pomoc &e&m-----'
  Main: ' &7- &e/%command% &7- Wkonuje losową teleportację!'
  Biome: ' &7- &e/%command% biome <biome1, biome2...> &7- Losowo teleportuje do któregoś z biomów'
  Edit: ' &7- &e/%command% edit <default/world> [args...] &7- Edytuje niektóre ustawienia pluginu'
  Help: ' &7- &e/%command% help &7- Pokazuje listę z pomocą'
  Info: ' &7- &e/%command% info [world/particles/shapes/potion_effects] &7- Pokazuje wybrane informacje o parametrach pluginu'
  Player: ' &7- &e/%command% player <player> [world] [biome1, biome2...] &7- Losowo teleportuje innego gracza'
  Reload: ' &7- &e/%command% reload &7- Przeładowuje plugin'
  Settings: ' &7- &e/%command% settings &7- Pokazuje GUI z ustawieniami'
  Test: ' &7- &e/%command% test &7- Testuje efekty teleportacji bez ruszania się z miejsca'
  Version: ' &7- &e/%command% version &7- Pokazuje wersję pluginu'
  World: ' &7- &e/%command% world <world> [biome1, biome2...] &7- Losowo teleportuj do innego świata'
  Location: ' &7- &e/%command% location <location_name> &7- Przenosi w podaną lokalizację'

Usage:
  Player: '&cUżycie&7: /%command% player <player> [world] [biome1, biome2]'
  World: '&cUżycie&7: /%command% world <world> [biome1, biome2...]'
  Biome: '&cUżycie&7: /%command% biome <biome1, biome2...>'
  Location: '&cUżycie&7: /%command% location <location_name>'
  Edit:
    Base: '&cUżycie&7: /%command% edit <default/world> [args...]'
    Default: '&cUżycie&7: /%command% edit default <max/min/useworldborder/center> <value>'
    World: '&cUżycie&7: /%command% edit world <world> <max/min/useworldborder/center> <value>'
#    PermissionGroup: '&cUsage&7: /%command% edit permission_group <group> <world> <max/min/useworldborder/center> <value>'
    Worldtype: '&cUżycie&7: /%command% edit world_type <world> <NETHER/NORMAL>'
    Override: '&cUżycie&7: /%command% edit override <world> <world_to>'
    BlacklistedBlocks: '&cUżycie&7: /%command% edit blacklistedblocks <add/remove> <block_id>'