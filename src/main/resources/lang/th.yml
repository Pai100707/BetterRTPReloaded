    Location: '&cวิธีใช้&7: /%command% edit location <location_name> <max/min/useworldborder/center> <value>'
    Worldtype: '&cวิธีใช้&7: /%command% edit world_type <world> <NETHER/NORMAL>'
    Override: '&cวิธีใช้&7: /%command% edit override <world> <world_to>'
