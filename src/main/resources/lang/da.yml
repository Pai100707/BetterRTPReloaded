Help:
  Prefix: '&e&m-----&6&l BetterRTP &8| Hjælp &e&m-----'
  Main: ' &7- &e/%command% &7- Teleporterer dig tilfældigt!'
  Biome: ' &7- &e/%command% biome <biome1, biome2...> &7- Teleportere tilfældigt inden for disse biomer'
  Edit: ' &7- &e/%command% edit <default/world> [args...] &7- Rediger nogle plugin-indstillinger'
  Help: ' &7- &e/%command% help &7- Viser hjælp liste'
  Info: ' &7- &e/%command% info [world/particles/shapes/potion_effects] &7- Se specifikke oplysninger om plugin-parametre'
  Player: ' &7- &e/%command% player <player> [world] [biome1, biome2...] &7- Teleporter tilfældigt en anden spiller'
  Reload: ' &7- &e/%command% reload &7- Genindlæser pluginet'
  Settings: ' &7- &e/%command% settings &7- Vis en GUI, og rediger nogle indstillinger'
  Test: ' &7- &e/%command% test &7- Test plugin-effekter efter en teleport uden at flytte'
  Version: ' &7- &e/%command% version &7- Se den aktuelle version'
  World: ' &7- &e/%command% world <world> [biome1, biome2...] &7- Teleportere tilfældigt i en anden verden'
  Location: ' &7- &e/%command% location <location_name> &7- Rtp til en bestemt placering'

Usage:
  Player: '&Brug&7: /%command% player <player> [world] [biome1, biome2]'
  World: '&Brug&7: /%command% world <world> [biome1, biome2...]'
  Biome: '&Brug&7: /%command% biome <biome1, biome2...>'
  Location: '&Brug&7: /%command% location <location_name>'
  Edit:
    Base: '&Brug&7: /%command% edit <default/world> [args...]'
    Default: '&Brug&7: /%command% edit default <max/min/useworldborder/center> <value>'
    World: '&Brug&7: /%command% edit world <world> <max/min/useworldborder/center> <value>'
#    PermissionGroup: '&cUsage&7: /%command% edit permission_group <group> <world> <max/min/useworldborder/center> <value>'
    Worldtype: '&Brug&7: /%command% edit world_type <world> <NETHER/NORMAL>'
    Override: '&Brug&7: /%command% edit override <world> <world_to>'
    BlacklistedBlocks: '&Brug&7: /%command% edit blacklistedblocks <add/remove> <block_id>'