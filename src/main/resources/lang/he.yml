  Reload: ' &7- &e/%command% reload &7- מפעיל את המערכת מחדש'
  Settings: ' &7- &e/%command% settings &7- פותח תפריט בשביל לערוך הגדרות'
  Test: ' &7- &e/%command% test &7- בודק את המערכת ללא שיגור של אף אחד'
